host = "127.0.0.1"
port = 25464
mode = "development"
[adapter]
driver = "local"
[cache]
driver = "memory"
[queue]
driver = "memory"
[app_manager]
driver = "memory"
[[app_manager.array.apps]]
id = "app-id"
key = "app-key"
secret = "app-secret"
enabled = true
[app_manager.array.apps.policy.features]
enable_client_messages = true
enable_user_authentication = true
[app_manager.array.apps.policy.limits]
max_client_events_per_second = 1000
[versioned_messages]
enabled = true
driver = "memory"
retention_window_seconds = 0
[history]
enabled = true
backend = "memory"
rewind_enabled = true
[connection_recovery]
enabled = true
[annotations]
enabled = true
[ai_transport]
enabled = true
[[ai_transport.channels]]
prefix = "private-ai-"
[ai_transport.rollup]
enabled = false
[ably_compat]
enabled = true
[push]
storage_driver = "memory"
queue_driver = "memory"
allow_memory_drivers = true
[metrics]
enabled = false
[opentelemetry]
enabled = false
