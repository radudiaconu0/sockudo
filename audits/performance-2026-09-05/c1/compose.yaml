services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: c1
      POSTGRES_PASSWORD: c1-local-only
      POSTGRES_DB: c1
    ports: ["127.0.0.1:25461:5432"]
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: c1-local-only
      MYSQL_DATABASE: c1
    ports: ["127.0.0.1:25462:3306"]
  redis:
    image: redis:7.4
    ports: ["127.0.0.1:25463:6379"]
